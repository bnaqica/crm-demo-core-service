# Defaults for every environment. Values come from environment variables so the
# same image runs anywhere; the `local` profile fills them in for local development.
server:
  port: 8081

spring:
  application:
    name: crm-demo-core-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate:
        default_schema: crm_demo_core_service
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: crm_demo_core_service   # never the public schema
    schemas: crm_demo_core_service,audit
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}   # the crm-internal realm; tokens must also be for audience crm-api
      client:
        # Client-credentials client for calls to the UMS (scopes ums:team-scope and ums:catalog)
        registration:
          core-service:
            provider: crm-internal
            client-id: core-service
            client-secret: ${KEYCLOAK_CORE_SERVICE_SECRET}
            authorization-grant-type: client_credentials
          # Only for the UMS promote call (scope ums:promote)
          crm-promoter:
            provider: crm-internal
            client-id: crm-promoter
            client-secret: ${KEYCLOAK_CRM_PROMOTER_SECRET}
            authorization-grant-type: client_credentials
        provider:
          crm-internal:
            token-uri: ${KEYCLOAK_BASE_URL}/realms/crm-internal/protocol/openid-connect/token
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: crm-demo-core-service
      auto-offset-reset: earliest
    producer:
      acks: all

crm:
  ums:
    base-url: ${UMS_BASE_URL}
  scope-cache:
    ttl: ${CRM_SCOPE_CACHE_TTL:5m}   # at most 5m
  catalog:
    retry-interval: ${CRM_CATALOG_RETRY_INTERVAL:30s}
  outbox:
    relay-interval: ${CRM_OUTBOX_RELAY_INTERVAL:1s}
  routing:
    default-team-id: ${CRM_DEFAULT_TEAM_ID}   # UMS team for submissions no routing rule matches
  topics:
    user-events: ums-user-events
    audit-events: audit-events
    portal-intake: portal-intake   # dead letters go to portal-intake-dlq
    submission-status: submission-status
  cors:
    allowed-origins: ${CRM_CORS_ALLOWED_ORIGINS}   # comma-separated, e.g. https://crm.example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info

# API docs are only switched on by the `local` profile
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
